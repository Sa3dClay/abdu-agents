# Foreman: pipeline orchestrator. Template from the "pipeline" plugin (skills/foreman).
# Replace <OWNER> below. Foreman's `setup` command fills this in for you.
name: Foreman

on:
  workflow_dispatch:
    inputs:
      command:
        description: "start | next | accept | feedback | change | gate-check | status"
        required: true
        default: next
      epic:
        description: "Epic ID, e.g. E01 (blank = any epic In progress)"
        required: false
        default: ""
      previous:
        description: "Result of the previous agent run (success | failure)"
        required: false
        default: ""
  pull_request:
    types: [closed]                 # design PR merged → start; epic review-pack PR merged → accept
  issue_comment:
    types: [created]                # "/foreman next|accept|feedback|status E01"
  push:
    branches: [main]
    paths: ["docs/plan.md"]         # gate row edited → gate-check (other plan.md changes are ignored)
  schedule:
    - cron: "17 */3 * * *"          # resume after failures or usage limits

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.r.outputs.command }}
      epic: ${{ steps.r.outputs.epic }}
      comment: ${{ steps.r.outputs.comment }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          IN_COMMAND: ${{ github.event.inputs.command }}
          IN_EPIC: ${{ github.event.inputs.epic }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd=""; epic=""; comment=""
          id_from_branch() { echo "$1" | sed -nE 's#^(design|epic)/(e[0-9]+)-.*#\2#p' | tr a-z A-Z; }
          case "$EVENT" in
            workflow_dispatch) cmd="$IN_COMMAND"; epic="$IN_EPIC" ;;
            schedule)
              # Only wake Foreman (and spend Claude usage) when some epic branch has an epic In progress.
              # Blocked epics wait for the founder; failed runs on In-progress epics are retried here.
              for b in $(gh api "repos/$REPO/branches?per_page=100" --jq '.[].name | select(startswith("epic/"))'); do
                if gh api "repos/$REPO/contents/docs/plan.md?ref=$b" --jq .content | base64 -d | grep -q '| In progress |'; then
                  cmd="next"; break
                fi
              done ;;
            push)
              # Only a changed gate row (e.g. "| — | **Gate 1** | … | Passed |") wakes Foreman; epic merges and status edits don't.
              if gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
                   --jq '.files[] | select(.filename == "docs/plan.md") | .patch' 2>/dev/null \
                 | grep -qE '^[+-]\|.*\*\*Gate'; then
                cmd="gate-check"; fi ;;
            pull_request)
              if [ "$PR_MERGED" = "true" ]; then
                if echo "$PR_LABELS" | grep -q '"design"'; then
                  cmd="start"; epic="$(id_from_branch "$PR_HEAD")"
                elif [[ "$PR_HEAD" == epic/* ]] && [ "$PR_BASE" = "$DEFAULT_BRANCH" ]; then
                  cmd="accept"; epic="$(id_from_branch "$PR_HEAD")"   # merging the review pack = accepting the epic
                fi
              fi ;;
            issue_comment)
              COMMENT="${COMMENT#"${COMMENT%%[![:space:]]*}"}"   # ignore leading spaces/newlines
              if [ "$ACTOR" = "$OWNER" ] && [[ "$COMMENT" =~ ^/foreman[[:space:]]+(next|accept|feedback|change|status)([[:space:]]+(E[0-9]+))? ]]; then
                cmd="${BASH_REMATCH[1]}"; epic="${BASH_REMATCH[3]}"; comment="$COMMENT_ID"; fi ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"
          echo "epic=$epic" >> "$GITHUB_OUTPUT"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"
          echo "Routed $EVENT → '${cmd:-none}' ${epic}"

  foreman:
    needs: route
    if: needs.route.outputs.command != ''
    # Concurrency on this job only, so events the router ignores (e.g. Foreman's own PR comments and merges)
    # never queue and can't cancel a pending real step. Shared with agent.yml: one pipeline step at a time.
    concurrency:
      group: foreman
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # PIPELINE_TOKEN: fine-grained PAT for this repo (read/write: Actions, Contents, Issues, Pull requests, Workflows;
      # read: Secrets) so agents can push and merge .github/workflows changes. Falls back to GITHUB_TOKEN if unset.
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN || github.token }}
      # Built-in token: comments/issues posted with it come from github-actions[bot], so @mentions notify the founder
      # (posts made with PIPELINE_TOKEN count as the founder's own activity and never notify).
      NOTIFY_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_TOKEN || github.token }}
      - uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_EFFORT_LEVEL: low   # Foreman only routes; agents do the heavy work
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PIPELINE_TOKEN || github.token }}
          plugin_marketplaces: "https://github.com/<OWNER>/abdu-agents.git"
          plugins: "pipeline@abdu-agents"
          prompt: "/pipeline:foreman ${{ needs.route.outputs.command }} --epic '${{ needs.route.outputs.epic }}' --previous '${{ github.event.inputs.previous }}' --comment '${{ needs.route.outputs.comment }}' --unattended"
          claude_args: '--model claude-sonnet-5-5 --max-turns 80 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"'
