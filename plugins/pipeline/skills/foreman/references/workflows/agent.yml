# Pipeline agent: runs ONE agent (Anvil, Assay or Atlas) in a fresh context, then hands back to Foreman.
# Template from the "pipeline" plugin (skills/foreman). Replace <OWNER> and the toolchain block.
name: Pipeline agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "anvil | assay | atlas"
        required: true
      args:
        description: "Task ID (E01-T03), or for Atlas: design-next | amend E01 | change E01"
        required: true
      epic:
        description: "Epic ID"
        required: false
        default: ""
      ref:
        description: "Branch to check out"
        required: true

concurrency:
  group: foreman
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # PIPELINE_TOKEN: see foreman.yml. Falls back to GITHUB_TOKEN if unset.
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_TOKEN || github.token }}

      # ---- Toolchain block: project-specific. Keep in sync with the project's CI. ----
      # Example for an Expo / React Native + Kotlin project:
      # - uses: actions/setup-node@v4
      #   with: { node-version-file: .nvmrc, cache: npm }
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: "17" }
      # - uses: gradle/actions/setup-gradle@v4
      # - run: npm ci
      # Give the build steps `if: github.event.inputs.agent != 'atlas'`: Atlas only reads code and writes docs.
      # ---------------------------------------------------------------------------

      # Snapshot every branch on GitHub, so the check below can tell whether the agent pushed anything.
      - name: Snapshot remote branches
        run: git ls-remote --heads origin | sort > "$RUNNER_TEMP/heads-before"

      - id: agent
        uses: anthropics/claude-code-action@v1
        env:
          # Atlas plans once per epic, so it gets high; Anvil and Assay use medium. Values: low | medium | high | xhigh | max | auto
          CLAUDE_CODE_EFFORT_LEVEL: ${{ github.event.inputs.agent == 'atlas' && 'high' || 'medium' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PIPELINE_TOKEN || github.token }}
          plugin_marketplaces: "https://github.com/<OWNER>/abdu-agents.git"
          plugins: "pipeline@abdu-agents"
          prompt: "/pipeline:${{ github.event.inputs.agent }} ${{ github.event.inputs.args }} --unattended"
          claude_args: '--model claude-opus-5-5 --max-turns 200 --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"'

      # Don't trust the agent's own account: every agent run must push something (code, a report or a plan).
      # Also surface permission denials and errors, which otherwise live only in the run log.
      - name: Check the agent's work
        id: check
        if: always()
        env:
          OUTCOME: ${{ steps.agent.outcome }}
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          git ls-remote --heads origin | sort > "$RUNNER_TEMP/heads-after"
          result="$OUTCOME"; note=""
          [ "$OUTCOME" != "success" ] && note="agent step $OUTCOME"
          if cmp -s "$RUNNER_TEMP/heads-before" "$RUNNER_TEMP/heads-after"; then
            result=failure; note="${note:+$note; }nothing was pushed to GitHub"
          fi
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            denied=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]?.tool_name]
              | group_by(.) | map("\(.[0]) x\(length)") | join(", ")' "$EXEC_FILE" 2>/dev/null || true)
            [ -n "$denied" ] && note="${note:+$note; }permission denials: $denied"
            ended=$(jq -r '[.[] | select(.type == "result")] | last | select(.is_error == true) | .subtype // empty' "$EXEC_FILE" 2>/dev/null || true)
            [ -n "$ended" ] && note="${note:+$note; }ended with $ended"
          fi
          note=$(printf '%s' "$note" | tr -d "\"'\`$\n" | cut -c1-300)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          { echo "### Agent check: $result"; echo "${note:-ok}"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand back to Foreman
        if: always()
        env:
          RESULT: ${{ steps.check.outputs.result || steps.agent.outcome }}
          NOTE: ${{ steps.check.outputs.note }}
        run: |
          gh workflow run foreman.yml \
            -f command=next \
            -f epic="${{ github.event.inputs.epic }}" \
            -f previous="$RESULT" \
            -f note="$NOTE"
